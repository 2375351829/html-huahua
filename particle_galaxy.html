<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子银河 · Code is Poetry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: absolute;
            color: #0ff;
            pointer-events: none;
            text-shadow: 0 0 10px #0ff;
            z-index: 10;
        }

        #stats {
            top: 20px;
            right: 20px;
            text-align: right;
            font-size: 16px;
        }

        #title {
            bottom: 20px;
            left: 20px;
            font-size: 20px;
        }

        #author {
            bottom: 50px;
            left: 20px;
            font-size: 14px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }

        #music-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #0ff;
            color: #0ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            text-shadow: 0 0 10px #0ff;
            z-index: 20;
            transition: all 0.3s;
        }

        #music-btn:hover {
            background: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 20px #0ff;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="stats" class="ui-overlay">
        <div id="fps">FPS: 60</div>
        <div id="particles">Particles: 0</div>
    </div>
    
    <div id="title" class="ui-overlay">粒子银河 · Code is Poetry</div>
    <div id="author" class="ui-overlay">2023级软件工程X班 · 姓名</div>
    
    <button id="music-btn">▶ 播放音乐</button>
    
    <audio id="bgm" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        /*
         * Project: Particle Galaxy · Code is Poetry
         * Author: 2023级软件工程X班 · 姓名
         * Tech Stack: HTML5 Canvas, Vanilla JavaScript
         * Theme: 智创青春 · 艺启未来
         * 
         * "在代码的星河里，每一行都是一首诗；
         *  每一个粒子，都是我们跳动的思维。"
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsEl = document.getElementById('fps');
        const particlesEl = document.getElementById('particles');
        const musicBtn = document.getElementById('music-btn');
        const bgm = document.getElementById('bgm');

        let width, height;
        let particles = [];
        let stars = [];
        let mouseX = 0, mouseY = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;
        let time = 0;
        let clickRings = [];

        const PARTICLE_COUNT = 300;
        const STAR_COUNT = 100;
        const CONNECTION_DISTANCE = 80;
        const MOUSE_INFLUENCE = 120;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                const centerX = width / 2;
                const centerY = height / 2;
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * Math.min(width, height) * 0.4;
                
                this.x = centerX + Math.cos(angle) * radius;
                this.y = centerY + Math.sin(angle) * radius;
                
                const speed = 0.5 + Math.random() * 1.5;
                this.vx = -Math.sin(angle) * speed;
                this.vy = Math.cos(angle) * speed;
                
                this.radius = 1 + Math.random() * 2;
                this.baseHue = 150 + Math.random() * 120;
                this.hue = this.baseHue;
                this.alpha = 0.5 + Math.random() * 0.5;
                this.pulseSpeed = 0.02 + Math.random() * 0.03;
                this.pulseOffset = Math.random() * Math.PI * 2;
            }

            update() {
                const centerX = width / 2;
                const centerY = height / 2;
                
                const dx = centerX - this.x;
                const dy = centerY - this.y;
                const distSquared = dx * dx + dy * dy;
                
                if (distSquared > 0) {
                    const dist = Math.sqrt(distSquared);
                    this.vx += (dx / dist) * 0.001;
                    this.vy += (dy / dist) * 0.001;
                }

                const mdx = mouseX - this.x;
                const mdy = mouseY - this.y;
                const mouseDistSquared = mdx * mdx + mdy * mdy;
                const maxMouseDistSquared = MOUSE_INFLUENCE * MOUSE_INFLUENCE;
                
                if (mouseDistSquared < maxMouseDistSquared && mouseDistSquared > 0) {
                    const dist = Math.sqrt(mouseDistSquared);
                    const force = (MOUSE_INFLUENCE - dist) / MOUSE_INFLUENCE * 0.3;
                    this.vx += (mdx / dist) * force;
                    this.vy += (mdy / dist) * force;
                }

                this.vx *= 0.98;
                this.vy *= 0.98;

                this.x += this.vx;
                this.y += this.vy;

                this.hue = this.baseHue + Math.sin(time * this.pulseSpeed + this.pulseOffset) * 30;
                this.currentRadius = this.radius + Math.sin(time * this.pulseSpeed * 2 + this.pulseOffset) * 0.5;

                if (this.x < -50 || this.x > width + 50 || 
                    this.y < -50 || this.y > height + 50) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.alpha})`;
                ctx.fill();
                
                if (Math.random() < 0.02) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.currentRadius * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, 0.2)`;
                    ctx.fill();
                }
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 1.5;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.twinkleSpeed = 0.01 + Math.random() * 0.03;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.currentAlpha = this.alpha + Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.3;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(0, 0%, 100%, ${Math.max(0, this.currentAlpha)})`;
                ctx.fill();
            }
        }

        class ClickRing {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = 150;
                this.alpha = 1;
                this.hue = Math.random() * 360;
            }

            update() {
                this.radius += 3;
                this.alpha -= 0.02;
                return this.alpha > 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 70%, ${this.alpha})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function init() {
            resize();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function drawConnections() {
            const gridSize = CONNECTION_DISTANCE;
            const grid = new Map();
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const gridX = Math.floor(p.x / gridSize);
                const gridY = Math.floor(p.y / gridSize);
                const key = `${gridX},${gridY}`;
                
                if (!grid.has(key)) {
                    grid.set(key, []);
                }
                grid.get(key).push(i);
            }
            
            ctx.beginPath();
            
            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                const gridX = Math.floor(p1.x / gridSize);
                const gridY = Math.floor(p1.y / gridSize);
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = `${gridX + dx},${gridY + dy}`;
                        const neighbors = grid.get(key);
                        
                        if (neighbors) {
                            for (const j of neighbors) {
                                if (j > i) {
                                    const p2 = particles[j];
                                    const dx = p1.x - p2.x;
                                    const dy = p1.y - p2.y;
                                    const distSquared = dx * dx + dy * dy;
                                    const maxDistSquared = CONNECTION_DISTANCE * CONNECTION_DISTANCE;
                                    
                                    if (distSquared < maxDistSquared) {
                                        ctx.moveTo(p1.x, p1.y);
                                        ctx.lineTo(p2.x, p2.y);
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            const hue = (time * 0.5) % 360;
            ctx.strokeStyle = `hsla(${hue}, 100%, 70%, 0.2)`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawBackgroundNebula() {
            const centerX = width / 2;
            const centerY = height / 2;
            
            for (let i = 0; i < 3; i++) {
                const radius = Math.min(width, height) * (0.2 + i * 0.15);
                const hue = (time * 0.2 + i * 60) % 360;
                
                const gradient = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, radius
                );
                gradient.addColorStop(0, `hsla(${hue}, 70%, 50%, 0.1)`);
                gradient.addColorStop(0.5, `hsla(${hue + 30}, 70%, 50%, 0.05)`);
                gradient.addColorStop(1, 'transparent');
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        function animate() {
            time++;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            drawBackgroundNebula();

            stars.forEach(s => {
                s.update();
                s.draw();
            });

            particles.forEach(p => {
                p.update();
            });

            drawConnections();

            particles.forEach(p => {
                p.draw();
            });

            clickRings = clickRings.filter(ring => {
                const alive = ring.update();
                if (alive) ring.draw();
                return alive;
            });

            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                fpsEl.textContent = `FPS: ${fps}`;
                particlesEl.textContent = `Particles: ${particles.length}`;
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('click', (e) => {
            clickRings.push(new ClickRing(e.clientX, e.clientY));
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        musicBtn.addEventListener('click', () => {
            if (bgm.paused) {
                bgm.play();
                musicBtn.textContent = '⏸ 暂停音乐';
            } else {
                bgm.pause();
                musicBtn.textContent = '▶ 播放音乐';
            }
        });

        init();
        animate();
    </script>
</body>
</html>
