<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博狂欢 - Cyber Rave</title>
    <!-- 引入外部库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        /* CSS 变量定义 - 默认主题：紫粉狂欢 */
        :root {
            --bg-color: #000011;
            --neon-purple: #c000ff;
            --neon-pink: #ff00a0;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --text-color: #ffffff;
            --card-bg: rgba(20, 20, 40, 0.7);
            --panel-bg: rgba(10, 10, 30, 0.8);
            --border-color: var(--neon-purple);
        }

        /* 青蓝冷色主题 */
        :root.theme-cyan {
            --neon-purple: #00f0ff;
            --neon-pink: #00a0ff;
            --neon-blue: #0060ff;
            --neon-green: #00ff80;
            --border-color: var(--neon-blue);
        }

        /* 熔金红主题 */
        :root.theme-gold {
            --neon-purple: #ff8000;
            --neon-pink: #ff0000;
            --neon-blue: #ff4000;
            --neon-green: #ffc000;
            --border-color: var(--neon-pink);
        }

        /* 冰白单色主题 */
        :root.theme-ice {
            --neon-purple: #ffffff;
            --neon-pink: #e0e0ff;
            --neon-blue: #c0c0ff;
            --neon-green: #a0a0ff;
            --border-color: var(--neon-purple);
        }

        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 容器样式 */
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 3D场景容器 */
        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 2D Canvas容器 */
        #canvas2d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* UI容器 */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
        }

        /* 区块样式 */
        .section {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 主标题样式 */
        .main-title {
            font-size: 6rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--neon-purple);
            text-shadow: 
                0 0 10px var(--neon-purple),
                0 0 20px var(--neon-purple),
                0 0 30px var(--neon-purple),
                0 0 40px var(--neon-purple);
            animation: glitch 3s infinite;
            position: relative;
            z-index: 10;
        }

        /* 副标题样式 */
        .sub-title {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 3rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            overflow: hidden;
            border-right: 0.15em solid var(--neon-blue);
            white-space: nowrap;
            margin: 0 auto;
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        /* 扫描线效果 */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            animation: scan 3s linear infinite;
            z-index: 9;
        }

        /* 频谱条容器 */
        #spectrum-bar {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            z-index: 10;
        }

        /* 频谱柱样式 */
        .spectrum柱 {
            width: 8px;
            background: linear-gradient(to top, var(--neon-pink), var(--neon-purple));
            border-radius: 4px 4px 0 0;
            animation: pulse 1s infinite;
        }

        /* 全息卡片容器 */
        #cards-container {
            display: flex;
            gap: 2rem;
            margin-top: 3rem;
            z-index: 10;
        }

        /* 全息卡片样式 */
        .hologram-card {
            width: 300px;
            height: 200px;
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hologram-card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(5deg);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }

        /* 卡片标题 */
        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        /* 卡片内部小Canvas */
        .card-canvas {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
        }

        /* 数字雨容器 */
        #digital-rain {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* 滚动标语 */
        #scrolling-text {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            white-space: nowrap;
            animation: scroll 20s linear infinite;
            z-index: 6;
        }

        /* 结尾文字 */
        #end-text {
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            color: var(--neon-green);
            text-shadow: 
                0 0 10px var(--neon-green),
                0 0 20px var(--neon-green),
                0 0 30px var(--neon-green);
            animation: glitch 2s infinite;
            z-index: 10;
        }

        /* 启动按钮 */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 1rem 2rem;
            background: var(--panel-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 2px solid var(--neon-purple);
            border-radius: 50px;
            color: var(--neon-purple);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            box-shadow: 0 0 20px var(--neon-purple);
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* 麦克风提示 */
        #mic-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 0.5rem 1rem;
            background: var(--panel-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--neon-blue);
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--neon-blue);
            z-index: 10;
        }

        /* 互动控制面板 */
        #control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 1.5rem;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(192, 0, 255, 0.3);
            transition: all 0.3s ease;
        }

        /* 控制面板标题 */
        #control-panel h3 {
            color: var(--neon-purple);
            text-align: center;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--neon-purple);
        }

        /* 控制面板按钮 */
        .control-btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .control-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .control-btn.active {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* 滑块容器 */
        .slider-container {
            margin-bottom: 1rem;
        }

        .slider-container label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--neon-blue);
        }

        .slider {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--neon-purple);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-purple);
        }

        /* 预设按钮组 */
        .preset-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .preset-btn {
            flex: 1;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-pink);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: rgba(255, 0, 160, 0.2);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* 面板折叠按钮 */
        #toggle-panel {
            position: absolute;
            top: -10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: var(--neon-purple);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-purple);
            transition: all 0.3s ease;
        }

        #toggle-panel:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 3rem;
            }

            .sub-title {
                font-size: 1rem;
            }

            #cards-container {
                flex-direction: column;
                align-items: center;
            }

            .hologram-card {
                width: 250px;
                height: 180px;
            }

            #end-text {
                font-size: 2rem;
            }

            #control-panel {
                width: 250px;
                padding: 1rem;
            }

            /* 移动端悬浮圆球 */
            #control-panel.collapsed {
                width: 60px;
                height: 60px;
                padding: 0;
                border-radius: 50%;
            }

            #control-panel.collapsed *:not(#toggle-panel) {
                display: none;
            }
        }

        /* 动画定义 */
        @keyframes glitch {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0);
            }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--neon-blue); }
        }

        @keyframes scan {
            0% {
                top: -10px;
            }
            100% {
                top: 100%;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scaleY(1);
            }
            50% {
                transform: scaleY(1.2);
            }
        }

        @keyframes scroll {
            0% {
                left: 100%;
            }
            100% {
                left: -100%;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 3D场景容器 -->
        <div id="canvas3d"></div>
        
        <!-- 2D Canvas容器 -->
        <canvas id="canvas2d"></canvas>
        
        <!-- UI容器 -->
        <div id="ui">
            <!-- 区块1：全屏加载与主视觉 -->
            <section class="section" id="section1">
                <div class="scan-line"></div>
                <h1 class="main-title">CYBER RAVE<br>霓虹狂欢</h1>
                <p class="sub-title">系统初始化 ● 声音载入中 ● 2026</p>
                <div id="spectrum-bar"></div>
            </section>
            
            <!-- 区块2：音频可视化核心区 -->
            <section class="section" id="section2">
                <h2 class="main-title">音频可视化</h2>
                <div id="mic-status">麦克风未连接，使用内置信号</div>
            </section>
            
            <!-- 区块3：数据流与全息卡片 -->
            <section class="section" id="section3">
                <h2 class="main-title">数据网络</h2>
                <div id="cards-container">
                    <div class="hologram-card">
                        <h3 class="card-title">神经链接</h3>
                        <canvas class="card-canvas" id="card1"></canvas>
                    </div>
                    <div class="hologram-card">
                        <h3 class="card-title">脉冲网络</h3>
                        <canvas class="card-canvas" id="card2"></canvas>
                    </div>
                    <div class="hologram-card">
                        <h3 class="card-title">量子狂欢</h3>
                        <canvas class="card-canvas" id="card3"></canvas>
                    </div>
                </div>
            </section>
            
            <!-- 区块4：数字雨传送带 -->
            <section class="section" id="section4">
                <div id="digital-rain"></div>
                <div id="scrolling-text">SIGNAL TRANSMISSION · DATA FLOW · CYBER RAVE ∞ 信号永续</div>
            </section>
            
            <!-- 区块5：结尾 -->
            <section class="section" id="section5">
                <h2 id="end-text">狂欢永不眠<br>THE RAVE NEVER SLEEPS</h2>
            </section>
        </div>
        
        <!-- 启动按钮 -->
        <button id="start-btn">▶ 点击启动</button>
        
        <!-- 互动控制面板 -->
        <div id="control-panel">
            <button id="toggle-panel">⚙️</button>
            <h3>CONTROL</h3>
            
            <!-- 麦克风控制 -->
            <button class="control-btn" id="mic-toggle">🎤 麦克风：关闭</button>
            
            <!-- 音乐控制组 -->
            <div class="slider-container">
                <label for="volume-slider">🎵 音量</label>
                <input type="range" id="volume-slider" class="slider" min="0" max="1" step="0.1" value="0.7">
            </div>
            <div class="slider-container">
                <label for="bpm-slider">⏱️ BPM: 130</label>
                <input type="range" id="bpm-slider" class="slider" min="60" max="180" step="5" value="130">
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" data-bpm="130">1/1 标准</button>
                <button class="preset-btn" data-bpm="65">½ 半速</button>
                <button class="preset-btn" data-bpm="260">X2 加倍</button>
            </div>
            <button class="control-btn" id="play-pause">▶ 播放</button>
            
            <!-- 视觉模式切换 -->
            <button class="control-btn" id="visual-mode">👁️ 视觉模式：赛博狂欢</button>
            
            <!-- 数字雨开关 -->
            <button class="control-btn active" id="digital-rain-toggle">🌧️ 数字雨：开启</button>
            
            <!-- 色彩主题切换 -->
            <button class="control-btn" id="theme-toggle">🎨 色彩主题：紫粉狂欢</button>
            
            <!-- 冻结/恢复 -->
            <button class="control-btn" id="freeze-toggle">⏸️ 冻结：关闭</button>
        </div>
    </div>

    <script>
        // 全局变量
        let scene, camera, renderer, particles, audioContext, analyser, dataArray;
        let canvas2d, ctx2d, digitalRainCanvas, ctxRain;
        let isAudioPlaying = false;
        let isMicActive = false;
        let isDigitalRainActive = true;
        let isFrozen = false;
        let mouseX = 0, mouseY = 0;
        let currentSection = 0;
        let sections = document.querySelectorAll('.section');
        let currentVisualMode = 0; // 0: 赛博狂欢, 1: 脉冲矩阵, 2: 全息蓝调, 3: 故障增强
        let currentTheme = 0; // 0: 紫粉狂欢, 1: 青蓝冷色, 2: 熔金红, 3: 冰白单色
        let bpm = 130;
        let volume = 0.7;
        let audioSources = [];

        // 初始化函数
        function init() {
            initScene();
            initCanvas();
            initUI();
            initAudio();
            initControls();
            animate();
            setupScroll();
            setupInteraction();
            setupKeyboardShortcuts();
        }

        // 初始化3D场景
        function initScene() {
            // 创建场景
            scene = new THREE.Scene();
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 50;
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000011, 0);
            document.getElementById('canvas3d').appendChild(renderer.domElement);
            
            // 创建粒子系统
            createParticles();
            
            // 添加光照
            const light = new THREE.PointLight(0xc000ff, 1, 100);
            light.position.set(0, 0, 0);
            scene.add(light);
            
            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);
        }

        // 创建粒子系统
        function createParticles() {
            const particleCount = window.innerWidth > 768 ? 5000 : 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                // 创建环形粒子
                const radius = 20 + Math.random() * 10;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 2;
                
                positions[i * 3] = radius * Math.sin(theta) * Math.cos(phi);
                positions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
                positions[i * 3 + 2] = radius * Math.cos(theta);
                
                // 初始颜色
                colors[i * 3] = 0.7 + Math.random() * 0.3; // 紫色
                colors[i * 3 + 1] = 0;
                colors[i * 3 + 2] = 0.7 + Math.random() * 0.3; // 蓝色
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            // 创建材质
            const material = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8
            });
            
            // 创建粒子
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 初始化Canvas 2D
        function initCanvas() {
            // 主Canvas
            canvas2d = document.getElementById('canvas2d');
            canvas2d.width = window.innerWidth;
            canvas2d.height = window.innerHeight;
            ctx2d = canvas2d.getContext('2d');
            
            // 数字雨Canvas
            digitalRainCanvas = document.createElement('canvas');
            digitalRainCanvas.width = window.innerWidth;
            digitalRainCanvas.height = window.innerHeight;
            ctxRain = digitalRainCanvas.getContext('2d');
            document.getElementById('digital-rain').appendChild(digitalRainCanvas);
            
            // 卡片Canvas
            initCardCanvases();
        }

        // 初始化卡片Canvas
        function initCardCanvases() {
            const cardCanvases = document.querySelectorAll('.card-canvas');
            cardCanvases.forEach((canvas, index) => {
                const ctx = canvas.getContext('2d');
                const colors = ['#c000ff', '#ff00a0', '#00f0ff'];
                
                // 绘制卡片内动画
                function drawCardAnimation() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const time = Date.now() * 0.001;
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    
                    for (let i = 0; i < 8; i++) {
                        const angle = (time * 0.5 + i * Math.PI * 0.25) % (Math.PI * 2);
                        const radius = 30 + Math.sin(time * 2 + i) * 10;
                        const x = centerX + Math.cos(angle) * radius;
                        const y = centerY + Math.sin(angle) * radius;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, Math.PI * 2);
                        ctx.fillStyle = colors[index];
                        ctx.fill();
                    }
                    
                    requestAnimationFrame(drawCardAnimation);
                }
                
                drawCardAnimation();
            });
        }

        // 初始化UI
        function initUI() {
            // 创建频谱条
            const spectrumBar = document.getElementById('spectrum-bar');
            for (let i = 0; i < 50; i++) {
                const bar = document.createElement('div');
                bar.className = 'spectrum柱';
                bar.style.height = '10px';
                spectrumBar.appendChild(bar);
            }
        }

        // 初始化音频系统
        function initAudio() {
            try {
                // 创建音频上下文
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 创建分析器
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                // 创建合成器
                createSynth();
                
            } catch (error) {
                console.error('音频初始化失败:', error);
            }
        }

        // 创建合成器
        function createSynth() {
            try {
                // 主音量控制
                const masterGain = audioContext.createGain();
                masterGain.gain.value = volume;
                masterGain.connect(analyser);
                analyser.connect(audioContext.destination);
                
                // 低频贝斯
                const bassOsc = audioContext.createOscillator();
                const bassGain = audioContext.createGain();
                
                bassOsc.type = 'sawtooth';
                bassOsc.frequency.value = 60;
                
                bassGain.gain.value = 0;
                
                bassOsc.connect(bassGain);
                bassGain.connect(masterGain);
                
                // 高频镲音
                const hihatOsc = audioContext.createOscillator();
                const hihatGain = audioContext.createGain();
                
                hihatOsc.type = 'square';
                hihatOsc.frequency.value = 8000;
                
                hihatGain.gain.value = 0;
                
                hihatOsc.connect(hihatGain);
                hihatGain.connect(masterGain);
                
                // 启动振荡器
                bassOsc.start();
                hihatOsc.start();
                
                // 存储音频源
                audioSources = [bassOsc, hihatOsc, bassGain, hihatGain, masterGain];
                
                // 创建节拍
                let time = audioContext.currentTime;
                const interval = 60 / bpm;
                
                function playBeat() {
                    if (!isAudioPlaying) return;
                    
                    // 贝斯
                    bassGain.gain.setValueAtTime(0.3, time);
                    bassGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                    
                    // 镲音
                    if (Math.floor(time / interval) % 2 === 0) {
                        hihatGain.gain.setValueAtTime(0.1, time);
                        hihatGain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
                    }
                    
                    time += interval;
                    setTimeout(playBeat, interval * 1000);
                }
                
                playBeat();
            } catch (error) {
                console.error('创建合成器失败:', error);
            }
        }

        // 初始化控制面板
        function initControls() {
            const controlPanel = document.getElementById('control-panel');
            const togglePanel = document.getElementById('toggle-panel');
            
            // 面板折叠/展开
            togglePanel.addEventListener('click', () => {
                controlPanel.classList.toggle('collapsed');
            });
            
            // 麦克风开关
            const micToggle = document.getElementById('mic-toggle');
            micToggle.addEventListener('click', toggleMic);
            
            // 音量控制
            const volumeSlider = document.getElementById('volume-slider');
            volumeSlider.addEventListener('input', (e) => {
                volume = parseFloat(e.target.value);
                if (audioSources[4]) {
                    audioSources[4].gain.value = volume;
                }
            });
            
            // BPM控制
            const bpmSlider = document.getElementById('bpm-slider');
            const bpmLabel = bpmSlider.previousElementSibling;
            bpmSlider.addEventListener('input', (e) => {
                bpm = parseInt(e.target.value);
                bpmLabel.textContent = `⏱️ BPM: ${bpm}`;
            });
            
            // 节奏预设
            const presetButtons = document.querySelectorAll('.preset-btn');
            presetButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const newBpm = parseInt(btn.dataset.bpm);
                    bpm = newBpm;
                    bpmSlider.value = newBpm;
                    bpmLabel.textContent = `⏱️ BPM: ${newBpm}`;
                });
            });
            
            // 播放/暂停
            const playPauseBtn = document.getElementById('play-pause');
            playPauseBtn.addEventListener('click', togglePlayPause);
            
            // 视觉模式切换
            const visualModeBtn = document.getElementById('visual-mode');
            visualModeBtn.addEventListener('click', toggleVisualMode);
            
            // 数字雨开关
            const digitalRainToggle = document.getElementById('digital-rain-toggle');
            digitalRainToggle.addEventListener('click', toggleDigitalRain);
            
            // 色彩主题切换
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', toggleTheme);
            
            // 冻结/恢复
            const freezeToggle = document.getElementById('freeze-toggle');
            freezeToggle.addEventListener('click', toggleFreeze);
        }

        // 切换麦克风
        function toggleMic() {
            const micToggle = document.getElementById('mic-toggle');
            
            if (!isMicActive) {
                // 请求麦克风
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            const micSource = audioContext.createMediaStreamSource(stream);
                            micSource.connect(analyser);
                            isMicActive = true;
                            micToggle.textContent = '🎤 麦克风：开启';
                            micToggle.classList.add('active');
                            document.getElementById('mic-status').textContent = 'LIVE';
                            playClickSound();
                        })
                        .catch(error => {
                            console.log('麦克风访问被拒绝:', error);
                            micToggle.textContent = '🎤 麦克风：未授权';
                        });
                }
            } else {
                // 关闭麦克风
                isMicActive = false;
                micToggle.textContent = '🎤 麦克风：关闭';
                micToggle.classList.remove('active');
                document.getElementById('mic-status').textContent = '麦克风未连接，使用内置信号';
                playClickSound();
            }
        }

        // 切换播放/暂停
        function togglePlayPause() {
            const playPauseBtn = document.getElementById('play-pause');
            
            if (!isAudioPlaying) {
                isAudioPlaying = true;
                playPauseBtn.textContent = '⏸️ 暂停';
                playPauseBtn.classList.add('active');
                // 重新创建合成器
                createSynth();
                playClickSound();
            } else {
                isAudioPlaying = false;
                playPauseBtn.textContent = '▶ 播放';
                playPauseBtn.classList.remove('active');
                // 停止所有音频源
                audioSources.forEach(source => {
                    if (source.stop) {
                        try {
                            source.stop();
                        } catch (e) {
                            // 忽略已停止的音频源
                        }
                    }
                });
                audioSources = [];
                playClickSound();
            }
        }

        // 切换视觉模式
        function toggleVisualMode() {
            const visualModeBtn = document.getElementById('visual-mode');
            const modes = ['赛博狂欢', '脉冲矩阵', '全息蓝调', '故障增强'];
            
            currentVisualMode = (currentVisualMode + 1) % modes.length;
            visualModeBtn.textContent = `👁️ 视觉模式：${modes[currentVisualMode]}`;
            playClickSound();
        }

        // 切换数字雨
        function toggleDigitalRain() {
            const digitalRainToggle = document.getElementById('digital-rain-toggle');
            isDigitalRainActive = !isDigitalRainActive;
            
            if (isDigitalRainActive) {
                digitalRainToggle.textContent = '🌧️ 数字雨：开启';
                digitalRainToggle.classList.add('active');
                digitalRainCanvas.style.display = 'block';
            } else {
                digitalRainToggle.textContent = '🌧️ 数字雨：关闭';
                digitalRainToggle.classList.remove('active');
                digitalRainCanvas.style.display = 'none';
            }
            
            playClickSound();
        }

        // 切换色彩主题
        function toggleTheme() {
            const themeToggle = document.getElementById('theme-toggle');
            const themes = ['紫粉狂欢', '青蓝冷色', '熔金红', '冰白单色'];
            const themeClasses = ['', 'theme-cyan', 'theme-gold', 'theme-ice'];
            
            // 移除所有主题类
            document.documentElement.classList.remove(...themeClasses);
            
            currentTheme = (currentTheme + 1) % themes.length;
            
            // 添加当前主题类
            if (themeClasses[currentTheme]) {
                document.documentElement.classList.add(themeClasses[currentTheme]);
            }
            
            themeToggle.textContent = `🎨 色彩主题：${themes[currentTheme]}`;
            playClickSound();
        }

        // 切换冻结/恢复
        function toggleFreeze() {
            const freezeToggle = document.getElementById('freeze-toggle');
            isFrozen = !isFrozen;
            
            if (isFrozen) {
                freezeToggle.textContent = '⏸️ 冻结：开启';
                freezeToggle.classList.add('active');
            } else {
                freezeToggle.textContent = '⏸️ 冻结：关闭';
                freezeToggle.classList.remove('active');
            }
            
            playClickSound();
        }

        // 播放点击音效
        function playClickSound() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // 设置滚动
        function setupScroll() {
            // 使用GSAP ScrollTrigger
            gsap.to(sections, {
                scrollTrigger: {
                    trigger: '#ui',
                    start: 'top top',
                    end: 'bottom bottom',
                    scrub: true,
                    onUpdate: (self) => {
                        currentSection = Math.floor(self.progress * sections.length);
                    }
                },
                yPercent: -100 * (sections.length - 1),
                ease: 'none'
            });
            
            // 自动滚动
            setInterval(() => {
                if (!isFrozen) {
                    currentSection = (currentSection + 1) % sections.length;
                    gsap.to(window, {
                        scrollTo: {
                            y: currentSection * window.innerHeight
                        },
                        duration: 1
                    });
                }
            }, 8000);
        }

        // 设置交互
        function setupInteraction() {
            // 鼠标移动
            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            });
            
            // 触摸移动
            document.addEventListener('touchmove', (event) => {
                event.preventDefault();
                const touch = event.touches[0];
                mouseX = (touch.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(touch.clientY / window.innerHeight) * 2 + 1;
            });
            
            // 启动按钮
            const startBtn = document.getElementById('start-btn');
            startBtn.addEventListener('click', async () => {
                try {
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }
                    isAudioPlaying = true;
                    startBtn.style.display = 'none';
                    playClickSound();
                } catch (error) {
                    console.error('启动音频失败:', error);
                }
            });
            
            // 点击页面恢复音频
            document.addEventListener('click', async () => {
                try {
                    if (audioContext && audioContext.state === 'suspended') {
                        await audioContext.resume();
                        isAudioPlaying = true;
                        document.getElementById('start-btn').style.display = 'none';
                    }
                } catch (error) {
                    console.error('恢复音频失败:', error);
                }
            });
        }

        // 设置键盘快捷键
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (event) => {
                switch (event.key.toLowerCase()) {
                    case 'm':
                        toggleMic();
                        break;
                    case 'v':
                        toggleVisualMode();
                        break;
                    case 'd':
                        toggleDigitalRain();
                        break;
                    case ' ': // 空格键
                        event.preventDefault();
                        togglePlayPause();
                        break;
                    case 'f':
                        toggleFreeze();
                        break;
                }
            });
        }

        // 主动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新粒子
            updateParticles();
            
            // 绘制Canvas
            drawCanvas();
            
            // 绘制数字雨
            if (isDigitalRainActive) {
                drawDigitalRain();
            }
            
            // 渲染3D场景
            renderer.render(scene, camera);
        }

        // 更新粒子
        function updateParticles() {
            if (particles) {
                // 旋转粒子
                if (!isFrozen) {
                    particles.rotation.x += 0.001;
                    particles.rotation.y += 0.002;
                    
                    // 鼠标交互
                    particles.rotation.x += mouseY * 0.001;
                    particles.rotation.y += mouseX * 0.001;
                }
                
                // 音频响应
                if (isAudioPlaying && analyser) {
                    try {
                        analyser.getByteFrequencyData(dataArray);
                        
                        // 获取低频能量
                        const lowFreqEnergy = dataArray.slice(0, 32).reduce((sum, value) => sum + value, 0) / 32;
                        
                        // 缩放粒子
                        const scale = 1 + lowFreqEnergy / 255 * 0.3;
                        particles.scale.set(scale, scale, scale);
                        
                        // 更新粒子颜色
                        const colors = particles.geometry.attributes.color.array;
                        for (let i = 0; i < colors.length; i += 3) {
                            // 根据频率数据调整颜色
                            const freqIndex = Math.floor((i / 3) % dataArray.length);
                            const energy = dataArray[freqIndex] / 255;
                            
                            // 根据视觉模式调整颜色
                            switch (currentVisualMode) {
                                case 0: // 赛博狂欢
                                    colors[i] = 0.7 + energy * 0.3; // 紫色
                                    colors[i + 1] = energy * 0.5; // 粉色
                                    colors[i + 2] = 0.7 + energy * 0.3; // 蓝色
                                    break;
                                case 1: // 脉冲矩阵
                                    colors[i] = energy * 0.8; // 蓝色
                                    colors[i + 1] = energy * 0.8; // 蓝色
                                    colors[i + 2] = 1; // 白色
                                    break;
                                case 2: // 全息蓝调
                                    colors[i] = 0.5 + energy * 0.5; // 浅蓝色
                                    colors[i + 1] = 0.8 + energy * 0.2; // 白色
                                    colors[i + 2] = 1; // 蓝色
                                    break;
                                case 3: // 故障增强
                                    colors[i] = Math.random() * 0.5 + 0.5; // 随机红色
                                    colors[i + 1] = Math.random() * 0.5; // 随机绿色
                                    colors[i + 2] = Math.random() * 0.5 + 0.5; // 随机蓝色
                                    break;
                            }
                        }
                        particles.geometry.attributes.color.needsUpdate = true;
                        
                        // 更新频谱条
                        updateSpectrumBar();
                    } catch (error) {
                        console.error('更新粒子失败:', error);
                    }
                }
            }
        }

        // 更新频谱条
        function updateSpectrumBar() {
            const bars = document.querySelectorAll('.spectrum柱');
            bars.forEach((bar, index) => {
                if (index < dataArray.length / 4) {
                    const height = dataArray[index] / 255 * 40;
                    bar.style.height = `${height}px`;
                }
            });
        }

        // 绘制Canvas
        function drawCanvas() {
            if (ctx2d) {
                try {
                    ctx2d.clearRect(0, 0, canvas2d.width, canvas2d.height);
                    
                    // 绘制环形频谱
                    if (isAudioPlaying && analyser && dataArray) {
                        const centerX = canvas2d.width / 2;
                        const centerY = canvas2d.height / 2;
                        const radius = 100;
                        
                        ctx2d.save();
                        ctx2d.translate(centerX, centerY);
                        
                        for (let i = 0; i < 64; i++) {
                            const angle = (i / 64) * Math.PI * 2;
                            const energy = dataArray[i] / 255;
                            const barLength = energy * 50;
                            
                            const x1 = Math.cos(angle) * radius;
                            const y1 = Math.sin(angle) * radius;
                            const x2 = Math.cos(angle) * (radius + barLength);
                            const y2 = Math.sin(angle) * (radius + barLength);
                            
                            // 颜色渐变
                            const gradient = ctx2d.createLinearGradient(x1, y1, x2, y2);
                            switch (currentVisualMode) {
                                case 0:
                                    gradient.addColorStop(0, '#c000ff');
                                    gradient.addColorStop(1, '#00f0ff');
                                    break;
                                case 1:
                                    gradient.addColorStop(0, '#00f0ff');
                                    gradient.addColorStop(1, '#ffffff');
                                    break;
                                case 2:
                                    gradient.addColorStop(0, '#00a0ff');
                                    gradient.addColorStop(1, '#ffffff');
                                    break;
                                case 3:
                                    gradient.addColorStop(0, '#ff00a0');
                                    gradient.addColorStop(1, '#c000ff');
                                    break;
                            }
                            
                            ctx2d.beginPath();
                            ctx2d.moveTo(x1, y1);
                            ctx2d.lineTo(x2, y2);
                            ctx2d.lineWidth = 2;
                            ctx2d.strokeStyle = gradient;
                            ctx2d.stroke();
                        }
                        
                        ctx2d.restore();
                    }
                } catch (error) {
                    console.error('绘制Canvas失败:', error);
                }
            }
        }

        // 绘制数字雨
        function drawDigitalRain() {
            if (ctxRain) {
                try {
                    // 半透明背景
                    ctxRain.fillStyle = 'rgba(0, 0, 17, 0.1)';
                    ctxRain.fillRect(0, 0, digitalRainCanvas.width, digitalRainCanvas.height);
                    
                    // 数字雨字符
                    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
                    
                    // 初始化雨滴
                    if (!window.rainDrops) {
                        window.rainDrops = [];
                        const columns = Math.floor(digitalRainCanvas.width / 20);
                        for (let i = 0; i < columns; i++) {
                            window.rainDrops.push({
                                x: i * 20,
                                y: Math.random() * digitalRainCanvas.height,
                                speed: 1 + Math.random() * 3,
                                charIndex: 0
                            });
                        }
                    }
                    
                    // 绘制雨滴
                    ctxRain.font = '16px monospace';
                    window.rainDrops.forEach(drop => {
                        // 随机颜色
                        const colors = ['#c000ff', '#ff00a0', '#00f0ff', '#39ff14'];
                        ctxRain.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                        
                        // 绘制字符
                        const char = chars[Math.floor(Math.random() * chars.length)];
                        ctxRain.fillText(char, drop.x, drop.y);
                        
                        // 更新位置
                        if (!isFrozen) {
                            drop.y += drop.speed;
                        }
                        
                        // 重置
                        if (drop.y > digitalRainCanvas.height) {
                            drop.y = 0;
                            drop.speed = 1 + Math.random() * 3;
                        }
                    });
                } catch (error) {
                    console.error('绘制数字雨失败:', error);
                }
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
